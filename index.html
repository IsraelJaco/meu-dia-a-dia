<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Dia a Dia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Meu Dia a Dia</h1>
    <button id="toggle-dark-mode">Modo Escuro</button>
  </header>

  <main>
    <section id="tarefas">
      <h2>Lista de Tarefas</h2>
      <input type="text" id="nova-tarefa" placeholder="Digite uma tarefa...">
      <button onclick="adicionarTarefa()">Adicionar</button>
      <ul id="lista-tarefas"></ul>
      <button onclick="exportarPDF()">Exportar PDF</button>
    </section>

    <section id="clima">
      <h2>☀️ Previsão do Tempo</h2>
      <p id="local">Local: ...</p>
      <p id="temperatura">Temperatura: ...</p>
      <p id="descricao-clima">Clima: ...</p>
    </section>

    <section id="motivacional">
      <h2>💬 Frase Motivacional</h2>
      <blockquote id="frase-texto">Carregando frase motivacional...</blockquote>
      <footer id="autor-frase"></footer>
      <button onclick="novaFrase()">Nova Frase</button>
    </section>
    

    <section id="bloco-notas">
      <h2>Bloco de Notas</h2>
      <textarea id="notas" placeholder="Escreva suas ideias aqui..."></textarea>
      <button onclick="exportarNotasPDF()">Exportar PDF</button>

    </section>
  </main>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/tarefas.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/frases.js"></script>
  <script src="js/pdf.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
